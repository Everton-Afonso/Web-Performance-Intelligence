name: wpintel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wpintel
      POSTGRES_PASSWORD: wpintel
      POSTGRES_DB: wpintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpintel -d wpintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      PAGESPEED_API_URL: https://www.googleapis.com/pagespeedonline/v5/runPagespeed
      PAGESPEED_TIMEOUT_MS: 120000
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      CRUX_API_URL: https://chromeuxreport.googleapis.com/v1/records:queryRecord
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://wpintel:wpintel@db:5432/wpintel
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata: